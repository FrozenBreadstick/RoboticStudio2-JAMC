name: Generate and Deploy Doxygen Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Installs the official Doxygen binary (e.g., 1.17.0)
      - name: Install Latest Doxygen
        uses: ssciwr/doxygen-install@v2
        with:
          version: "latest"

      # Graphviz is still best installed via apt as a dependency
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Build Doxygen Documentation
        run: |
          doxygen Doxyfile

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs' # Adjust this to match your Doxyfile OUTPUT_DIRECTORY

      - name: Deploy to GitHub Pages Live Site
        id: deployment
        uses: actions/deploy-pages@v4