name: Generate and Deploy Doxygen Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        run: |
          doxygen Doxyfile

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Ensure this matches the 'HTML_OUTPUT' or 'OUTPUT_DIRECTORY' in your Doxyfile
          path: './docs' 

      - name: Deploy to GitHub Pages Live Site
        id: deployment
        uses: actions/deploy-pages@v4